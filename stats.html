<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Trial Stats — WOD Generator</title>
<style>
@import url('https://fonts.googleapis.com/css?family=Poppins:400,600,700,800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',system-ui,'Segoe UI',Tahoma,sans-serif;background:radial-gradient(circle at 50% 0%,#241a12 0%,#12100e 55%,#0d0b0a 100%);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
h1{font-size:19px;font-weight:800;color:#ff8a2b;letter-spacing:.5px;margin-bottom:4px}
.sub{font-size:12px;color:#9a8f86;margin-bottom:28px}
.big{background:linear-gradient(180deg,rgba(255,120,0,.14),rgba(255,120,0,.04));border:1px solid rgba(255,120,0,.35);border-radius:24px;padding:30px 46px;box-shadow:0 8px 40px rgba(255,90,0,.12);margin-bottom:20px;min-width:230px}
.big .label{font-size:13px;color:#c9bdb2;font-weight:600;margin-bottom:8px;letter-spacing:.3px}
.big .num{font-size:72px;font-weight:800;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.row{display:flex;gap:14px;margin-bottom:26px;flex-wrap:wrap;justify-content:center}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:16px 22px;min-width:120px}
.card .n{font-size:34px;font-weight:800;color:#ff8a2b;line-height:1;font-variant-numeric:tabular-nums}
.card .t{font-size:11px;color:#9a8f86;font-weight:600;margin-top:6px;letter-spacing:.3px}
button{background:#ff6a00;color:#000;border:none;border-radius:14px;padding:13px 26px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;min-height:48px}
button:active{transform:scale(.97)}
.st{font-size:11px;color:#6f665e;margin-top:16px;min-height:14px}
.err{color:#e06a6a}
</style>
</head>
<body>
  <h1>🏋️ Trial Stats</h1>
  <div class="sub">WOD Generator — people who opened the free trial</div>

  <div class="big">
    <div class="label">Total trial visitors</div>
    <div class="num" id="total">—</div>
  </div>

  <div class="row">
    <div class="card"><div class="n" id="today">—</div><div class="t">Today</div></div>
    <div class="card"><div class="n" id="last7">—</div><div class="t">Last 7 days</div></div>
  </div>

  <button id="refresh" onclick="load()">🔄 Refresh</button>
  <div class="st" id="status">Loading…</div>

<script>
var SUPABASE_URL='https://gjdqkitasyuwqatyitdj.supabase.co';
var SUPABASE_KEY='sb_publishable_fEBMY_xuuK-SHDf1Yulxug_Y-sdutRG';
function fmt(n){return (n==null?'—':(''+n).replace(/\B(?=(\d{3})+(?!\d))/g,','));}
function load(){
  var st=document.getElementById('status');
  st.className='st';st.textContent='Loading…';
  fetch(SUPABASE_URL+'/rest/v1/rpc/trial_stats',{
    method:'POST',
    headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},
    body:'{}'
  }).then(function(r){return r.json();}).then(function(d){
    if(!d||typeof d!=='object'||d.total==null){throw new Error('bad');}
    document.getElementById('total').textContent=fmt(d.total);
    document.getElementById('today').textContent=fmt(d.today);
    document.getElementById('last7').textContent=fmt(d.last7);
    var t=new Date();
    st.className='st';st.textContent='Last updated: '+t.toLocaleTimeString('en-US');
  }).catch(function(){
    st.className='st err';st.textContent='Couldn’t load stats — check your connection and that the Supabase function step was run.';
  });
}
load();
setInterval(load,30000); // auto-refresh every 30s
</script>
</body>
</html>
